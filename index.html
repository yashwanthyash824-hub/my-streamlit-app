<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Streamlit App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { color: #555; line-height: 1.6; }
        button { background-color: #ff4b4b; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #d43f3f; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <p>Connecting to Python app...</p>
    </div>

    <script>
        const ws = new WebSocket("ws://127.0.0.1:8501/ws");
        const appContainer = document.getElementById("app");

        ws.onmessage = (event) => {
            const elements = JSON.parse(event.data);
            appContainer.innerHTML = "";

            elements.forEach(el => {
                if (el.type === "title") {
                    const h1 = document.createElement("h1");
                    h1.innerText = el.content;
                    appContainer.appendChild(h1);
                } else if (el.type === "text") {
                    const p = document.createElement("p");
                    p.innerText = el.content;
                    appContainer.appendChild(p);
                } else if (el.type === "button") {
                    const btn = document.createElement("button");
                    btn.innerText = el.label;
                    btn.onclick = () => alert(`Clicked: ${el.label}`);
                    appContainer.appendChild(btn);
                }
            });
        };
    </script>
</body>
</html>
